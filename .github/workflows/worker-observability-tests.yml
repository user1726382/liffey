name: Worker observability tests
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "contact-worker/**"
      - ".github/workflows/worker-observability-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test contact-worker/observability.test.mjs
