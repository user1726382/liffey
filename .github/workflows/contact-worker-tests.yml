name: Contact Worker tests
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "contact-worker/**"
      - "assets/contact-form.js"
      - ".github/workflows/contact-worker-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run Worker unit tests
        run: |
          node --version
          node --test contact-worker/worker.test.mjs
