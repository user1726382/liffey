name: Mail DNS authentication audit
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/check-mail-auth.mjs"
      - "scripts/check-mail-auth.test.mjs"
      - ".github/workflows/mail-dns-auth-audit.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Unit tests
        run: node --test scripts/check-mail-auth.test.mjs
      - name: Read-only public DNS checks
        run: node scripts/check-mail-auth.mjs
