<!-- Embed in the existing contact page after adapting site layout and privacy link. -->
<section id="liffey-contact" aria-labelledby="contact-heading">
<h2 id="contact-heading">Contact us / Kontakt</h2>
<form id="liffey-contact-form">
 <label for="contact-name">Name / Name</label><input id="contact-name" name="name" maxlength="120" autocomplete="name" required>
 <label for="contact-email">Email / E-Mail</label><input id="contact-email" name="email" type="email" maxlength="254" autocomplete="email" required>
 <label for="contact-topic">Topic / Thema</label><select id="contact-topic" name="topic" required><option value="">Please select / Bitte wählen</option><option value="recruitment">Recruitment / Personalvermittlung</option><option value="market-entry">Market entry / Markteintritt</option><option value="marketing">Marketing</option><option value="general">General / Allgemein</option></select>
 <label for="contact-message">Message / Nachricht</label><textarea id="contact-message" name="message" minlength="10" maxlength="4000" required></textarea>
 <div style="position:absolute;left:-10000px" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
 <p>We use your details to respond to your enquiry. See our <a href="/en/privacy">privacy notice</a> / <a href="/de/datenschutz">Datenschutzerklärung</a>. Do not send CVs or sensitive information through this form.</p>
 <div class="cf-turnstile" data-sitekey="REPLACE_WITH_TURNSTILE_SITE_KEY"></div>
 <button type="submit">Send enquiry / Anfrage senden</button>
 <p id="contact-status" role="status" aria-live="polite"></p>
</form>
</section>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script type="module">
const form=document.querySelector("#liffey-contact-form"),status=document.querySelector("#contact-status"),button=form.querySelector('button[type="submit"]');
form.addEventListener("submit",async event=>{
 event.preventDefault();button.disabled=true;status.textContent="Sending / Wird gesendet …";
 const data=new FormData(form);
 try{
  const response=await fetch("REPLACE_WITH_WORKER_ENDPOINT",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:data.get("name"),email:data.get("email"),topic:data.get("topic"),message:data.get("message"),website:data.get("website"),turnstileToken:data.get("cf-turnstile-response")})});
  const result=await response.json();
  if(!response.ok||!result.ok)throw new Error(result.error||"Delivery failed");
  status.textContent="Message sent / Nachricht gesendet";form.reset();
 }catch(e){status.textContent="Could not send. Please try again / Versand fehlgeschlagen. Bitte erneut versuchen."}
 finally{button.disabled=false;window.turnstile?.reset()}
});
</script>
